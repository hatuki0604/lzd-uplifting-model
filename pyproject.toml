[project]
name = "lzd-uplifting-model"
version = "0.1.0"
description = "Thực nghiệm CATE/uplift modeling trên dữ liệu Lazada"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "econml==0.17.0",
    "lightgbm==4.7.0",
    "matplotlib==3.10.9",
    "mlflow==3.15.1",
    "numpy==2.2.6",
    "optuna==4.9.0",
    "pandas==2.3.3",
    "pyarrow==25.0.0",
    "scikit-learn==1.7.2",
    "scipy==1.15.3",
    "seaborn==0.13.2",
]

[dependency-groups]
dev = [
    "ipykernel==7.3.0",
    "jupyterlab>=4.4,<5",
]

[tool.uv]
package = false
